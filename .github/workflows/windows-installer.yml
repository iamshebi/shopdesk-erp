name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      brand:
        description: "Brand folder in brands/ (e.g. default)"
        required: true
        default: default
      url:
        description: "Client website for online mode (empty = offline, own database on the PC)"
        required: false
        default: ""
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - shell: bash
        env:
          BRAND: ${{ github.event.inputs.brand || 'default' }}
          URL: ${{ github.event.inputs.url }}
        run: node scripts/build-desktop.mjs --brand "$BRAND" ${URL:+--url "$URL"} --pack
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ github.event.inputs.brand || 'default' }}
          path: release/*/*.exe
          if-no-files-found: error
