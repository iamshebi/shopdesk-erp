name: Build Windows installer

# Release a new version: change "version" in package.json and push to main (or push a tag like v2.3.0).
# The installer is built on Windows and published as GitHub release v<version>; installed apps pick it up
# through the website (/api/desktop/update) and update themselves. A version that is already released is skipped.
# "Run workflow" (manual) builds any brand without publishing; download it from the run's artifacts.

on:
  workflow_dispatch:
    inputs:
      brand:
        description: "Brand folder in brands/ (e.g. default)"
        required: true
        default: default
  push:
    branches: [main]
    paths: ["package.json", ".github/workflows/windows-installer.yml"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Is this version already released?
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "exists=1" >> "$GITHUB_OUTPUT"; else echo "exists=" >> "$GITHUB_OUTPUT"; fi
      - if: ${{ !(github.event_name == 'push' && steps.ver.outputs.exists) }}
        run: npm ci
      - name: Build installer
        if: ${{ !(github.event_name == 'push' && steps.ver.outputs.exists) }}
        run: node scripts/build-desktop.mjs --brand ${{ github.event.inputs.brand || 'default' }} --pack
      - name: Publish release
        if: ${{ github.event_name == 'push' && !steps.ver.outputs.exists }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ steps.ver.outputs.version }}"
          ls -la release/default
          gh release create "v$v" release/default/*.exe release/default/*.exe.blockmap release/default/latest.yml --repo "$GITHUB_REPOSITORY" --title "ShopDesk $v" --notes "ShopDesk desktop $v" --latest
      - uses: actions/upload-artifact@v4
        if: ${{ !(github.event_name == 'push' && steps.ver.outputs.exists) }}
        with:
          name: installer-${{ github.event.inputs.brand || 'default' }}
          path: |
            release/*/*.exe
            release/*/latest.yml
          if-no-files-found: error
