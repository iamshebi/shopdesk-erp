<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src file: data:" />
<title>ShopDesk</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 15px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: #0f172a;
    background: radial-gradient(1200px 600px at 50% -10%, #e6f4f1 0%, transparent 60%), linear-gradient(180deg, #f8fafc 0%, #eef2f6 100%);
    display: grid; place-items: center; -webkit-font-smoothing: antialiased; user-select: none;
  }
  .card {
    width: min(460px, calc(100vw - 48px)); background: #fff; border-radius: 20px; padding: 36px 36px 28px;
    box-shadow: 0 1px 2px rgba(15,23,42,.04), 0 24px 48px -18px rgba(15,23,42,.18); border: 1px solid #e8edf3; text-align: center;
    animation: rise .35s ease-out both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .logo { width: 64px; height: 64px; border-radius: 16px; box-shadow: 0 6px 16px -6px rgba(15,23,42,.25); }
  h1 { font-size: 22px; font-weight: 650; letter-spacing: -.01em; margin: 18px 0 4px; }
  .msg { color: #475569; margin: 0 auto; max-width: 360px; }
  .status { display: inline-flex; align-items: center; gap: 8px; margin-top: 22px; padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; }
  .status.connecting { background: #ecfdf5; color: #047857; }
  .status.offline { background: #fef2f2; color: #b91c1c; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .connecting .dot { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  .spinner { width: 28px; height: 28px; margin: 22px auto 0; border-radius: 50%; border: 3px solid #e2e8f0; border-top-color: #0f766e; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .actions { margin-top: 22px; display: flex; gap: 8px; justify-content: center; }
  button { font: 600 14px "Segoe UI", system-ui, sans-serif; border: 0; border-radius: 12px; padding: 10px 18px; cursor: pointer; background: #0f766e; color: #fff; }
  button.ghost { background: #f1f5f9; color: #0f172a; }
  button:hover { filter: brightness(1.05); }
  .tips { margin: 20px 0 0; padding: 14px 16px; background: #f8fafc; border-radius: 12px; text-align: left; font-size: 13px; color: #475569; }
  .tips li { margin: 2px 0; }
  .detail { margin-top: 16px; font-size: 11px; color: #94a3b8; font-family: Consolas, ui-monospace, monospace; word-break: break-all; }
  .foot { margin-top: 18px; font-size: 12px; color: #94a3b8; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="card">
  <img class="logo" src="icon.png" alt="" />
  <h1 id="title">ShopDesk</h1>
  <p class="msg" id="msg">Connecting to your shop…</p>
  <div class="spinner" id="spinner"></div>
  <div class="status hidden" id="status"><span class="dot"></span><span id="statusText"></span></div>
  <ul class="tips hidden" id="tips">
    <li>Check that the Wi-Fi or network cable is connected.</li>
    <li>Open any website in a browser to test the internet.</li>
    <li>The app reconnects by itself as soon as the internet is back.</li>
  </ul>
  <div class="actions hidden" id="actions"><button id="retry">Try again now</button></div>
  <div class="detail" id="detail"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
const p = new URLSearchParams(location.search);
const $ = (id) => document.getElementById(id);
const state = p.get("state") || "connecting";
$("title").textContent = p.get("product") || "ShopDesk";
document.title = p.get("product") || "ShopDesk";
$("foot").textContent = p.get("support") ? `Support: ${p.get("support")}` : "";
if (state === "offline") {
  $("spinner").classList.add("hidden");
  $("msg").textContent = p.get("msg") || "There's no internet connection right now.";
  $("status").className = "status offline"; $("statusText").textContent = "Offline · retrying every 10 seconds";
  $("tips").classList.remove("hidden");
  $("actions").classList.remove("hidden");
  $("detail").textContent = p.get("detail") || "";
} else {
  $("msg").textContent = p.get("msg") || "Connecting to your shop…";
  $("status").className = "status connecting"; $("statusText").textContent = "Connecting";
}
$("retry").onclick = () => {
  $("statusText").textContent = "Checking…";
  window.shopdeskDesktop && window.shopdeskDesktop.offline && window.shopdeskDesktop.offline.retry();
};
</script>
</body>
</html>
